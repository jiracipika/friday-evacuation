# 0 leaves the template's Godot-team ad-hoc signature in place on a modified
# bundle -> 'code has no resources...' invalid signature -> Gatekeeper kills
# the app as damaged on machines without Godot's private key. The workflow
# re-signs the exported app with codesign --force (ad-hoc) after export.
