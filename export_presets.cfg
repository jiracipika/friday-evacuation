# Export produces an UNSIGNED APK; Godot's internal signer ignores CLI env
# vars and wants editor-settings keystores. CI + local both sign afterwards
# with apksigner using the repo-committed android/debug.keystore (v1+v2+v3),
# so every build installs/upgrades cleanly. Never ship this key to a store.
package/signed=false
package/app_category=2
package/retain_data_on_uninstall=false
package/exclude_from_recents=false
package/show_in_android_tv=false
package/show_in_app_library=false
package/show_as_launcher_app=false
