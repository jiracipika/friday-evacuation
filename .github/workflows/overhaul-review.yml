name: Overhaul review checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install tested Godot version
        run: |
          curl --fail --location --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/friday-godot
          chmod +x /tmp/friday-godot/Godot_v4.6.3-stable_linux.x86_64
          sudo ln -s /tmp/friday-godot/Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
      - name: Import
        run: godot --headless --editor --path . --import --quit
      - name: Existing regression suites
        run: bash scripts/run_ladder.sh
      - name: Overhaul simulation, assets and separate-process LAN
        run: python3 tools/overhaul/verify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: overhaul-test-logs
          path: docs/ui-continuation/evidence/ladder-runs/
