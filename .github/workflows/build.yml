name: Build Friday Evacuation

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'ROADMAP.md'
      - 'GLM_HANDOFF.md'
      - 'docs/**'
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.1

permissions:
  contents: write

jobs:
  export:
    name: Export ${{ matrix.preset }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: "macOS"
            artifact: friday-evacuation-macos.zip
            path: builds/friday-evacuation-macos.zip
          - preset: "Web"
            artifact: friday-evacuation-web
            path: builds/friday-evacuation-web
          - preset: "Android"
            artifact: friday-evacuation.apk
            path: builds/friday-evacuation.apk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot (official release binary)
        shell: bash
        run: |
          curl -L -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT_BIN="$(find /tmp/godot -name 'Godot' -type f | head -1)"
          chmod +x "$GODOT_BIN"
          # Remove macOS quarantine attr so the unsigned binary runs on the runner
          xattr -dr com.apple.quarantine "$GODOT_BIN" || true
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --version

      - name: Import project resources
        shell: bash
        run: |
          "$GODOT_BIN" --headless --path . --import --quit 2>&1 | tail -5 || true
          "$GODOT_BIN" --headless --path . --script scripts/BootTest.gd 2>&1 | tail -5

      - name: Install export templates
        shell: bash
        run: |
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          curl -L -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          tar -xzf /tmp/templates.tpz --strip-components=1 -C "$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          ls "$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable" | head -5

      - name: Export ${{ matrix.preset }}
        shell: bash
        run: |
          mkdir -p builds
          mkdir -p builds/friday-evacuation-web
          # No path override: each preset's export_path in export_presets.cfg
          # is authoritative (the web preset needs its full index.html path).
          # NOTE: the Android signer still attempts internal release signing,
          # fails to find a keystore and exits 1 — but the UNSIGNED APK is
          # fully written at that point (we sign it ourselves next step), so
          # only the missing-APK case is fatal here.
          "$GODOT_BIN" --headless --path . --export-release "${{ matrix.preset }}" 2>&1 | tail -20 || true
          if [ "${{ matrix.preset }}" = "Android" ] && [ ! -f builds/friday-evacuation.apk ]; then
            echo "Android export did not produce an APK" >&2
            exit 1
          fi
          ls -la builds/

      - name: Sign Android APK (zipalign + v1/v2/v3 apksigner)
        if: matrix.preset == 'Android'
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-$HOME/Library/Android/sdk}"
          BT=$(ls "$SDK/build-tools" | sort -V | tail -1)
          ZA="$SDK/build-tools/$BT/zipalign"; AS="$SDK/build-tools/$BT/apksigner"
          cp android/debug.keystore "$HOME/.android/fe_debug.keystore"
          # zipalign MUST run before signing or the v2 signature breaks.
          "$ZA" -f 4 builds/friday-evacuation.apk /tmp/aligned.apk
          "$AS" sign --ks "$HOME/.android/fe_debug.keystore" --ks-key-alias androiddebugkey \
            --ks-pass pass:android --key-pass pass:android \
            --out /tmp/signed.apk /tmp/aligned.apk
          mv /tmp/signed.apk builds/friday-evacuation.apk
          "$AS" verify builds/friday-evacuation.apk

      - name: Re-sign macOS app ad-hoc and re-zip
        if: matrix.preset == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          cd builds
          rm -rf _resign
          mkdir _resign
          # The preset exports straight to a ZIP containing the .app bundle.
          unzip -q friday-evacuation-macos.zip -d _resign
          APP=$(find _resign -maxdepth 2 -name "*.app" | head -1)
          test -n "$APP"
          # Ad-hoc identity replaces the stale Godot-team signature left by
          # the export template ('code has no resources...' -> Gatekeeper
          # reports the app as damaged without this).
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          rm -f friday-evacuation-macos.zip
          ditto -c -k --keepParent "$APP" friday-evacuation-macos.zip
          shasum -a 256 friday-evacuation-macos.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

      - name: Zip web build for release
        if: matrix.preset == 'Web'
        run: |
          cd builds && zip -qr friday-evacuation-web.zip friday-evacuation-web/

      - name: Upload web zip artifact
        if: matrix.preset == 'Web'
        uses: actions/upload-artifact@v4
        with:
          name: friday-evacuation-web-zip
          path: builds/friday-evacuation-web.zip
          if-no-files-found: error

  release:
    name: Attach builds to release
    needs: export
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: .
          merge-multiple: true

      - name: Create/update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous
          name: Continuous Build
          body: Automated build from ${{ github.sha }}. Assets are rebuilt on every push to main.
          prerelease: true
          files: |
            ./friday-evacuation-macos.zip
            ./friday-evacuation.apk
            ./friday-evacuation-web.zip

  deploy-web:
    name: Deploy web build to Vercel
    needs: export
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: friday-evacuation-web
          path: public
          merge-multiple: true

      - name: Add COOP/COEP headers for threads
        run: |
          # Godot 4 web builds benefit from cross-origin isolation headers
          cat > public/_headers <<'EOF'
          /*
            Cross-Origin-Opener-Policy: same-origin
            Cross-Origin-Embedder-Policy: credentialless
            Cross-Origin-Resource-Policy: cross-origin
          EOF
          ls public/

      - name: Deploy to Vercel
        run: |
          npm i -g vercel@latest
          # Static deployment: point vercel at the public/ directory directly
          # (--prebuilt is only for `vercel build` output; we have raw files)
          cd public && vercel deploy . --prod --yes --token "$VERCEL_TOKEN" --name friday-evacuation
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
